[project]
name = "fastapi-production-starter"
version = "1.0.0"
description = "Multi-tenant FastAPI service: JWT with refresh-token rotation, RBAC, audit log, PostgreSQL, Alembic, Docker, CI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shijin B Gopal" }]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ folder is migrations, not the package

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
markers = ["settings(**overrides): override Settings fields for one test"]
