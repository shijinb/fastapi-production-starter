name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/starter_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest -q
      - name: Migrations are in sync with the models
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/starter_test
        run: alembic upgrade head && alembic check

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fastapi-production-starter:ci .
      - name: Start stack and smoke test
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do curl -fs http://localhost:8000/ready && break; sleep 2; done
          curl -fs http://localhost:8000/ready
          docker compose run --rm api python -m scripts.seed --customers 20
          TOKEN=$(curl -fs -X POST http://localhost:8000/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"owner@demo.example.com","password":"demo-password-change-me"}' | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fs http://localhost:8000/api/v1/customers/stats -H "Authorization: Bearer $TOKEN"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
